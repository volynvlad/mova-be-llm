[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "mova_be_llm"
version = "0.0.1"
description = "LLM for belarusian language"
authors = [
  { name = "volynvlad" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
dependencies = [
    "aiofiles>=25.1.0",
    "aiohttp>=3.13.1",
    "aiohttp-retry>=2.9.1",
    "beautifulsoup4>=4.14.2",
    "djvulibre-python>=0.9.3",
    "ebooklib>=0.20",
    "loguru",
    "mkdocs",
    "numpy>=2.3.4",
    "pandas>=2.3.3",
    "pip",
    "pypdf2>=3.0.1",
    "pytest",
    "python-dotenv",
    "requests>=2.32.5",
    "ruff",
    "tqdm",
    "typer",
    "yarl>=1.22.0",
]
requires-python = "~=3.12.0"


[tool.ruff]
line-length = 99
src = ["mova_be_llm"]
include = ["pyproject.toml", "mova_be_llm/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["mova_be_llm"]
force-sort-within-sections = true

[dependency-groups]
dev = [
    "ipykernel>=7.0.1",
]

