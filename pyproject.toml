[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "mova_be_llm"
version = "0.0.1"
description = "LLM for belarusian language"
authors = [
  { name = "volynvlad" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]

dependencies = [
    "accelerate>=1.0.0",
    "aiofiles>=25.1.0",
    "aiohttp>=3.13.1",
    "aiohttp-retry>=2.9.1",
    "beautifulsoup4>=4.14.2",
    "bitsandbytes>=0.48.2",
    "datasets>=3.0.0",
    "djvulibre-python>=0.9.3",
    "ebooklib>=0.20",
    "loguru>=0.7.2",
    "numpy<2.0.0",
    "pandas>=2.3.3",
    "peft>=0.17.1",
    "pycryptodome>=3.23.0",
    "pymupdf>=1.26.7",
    "pypdf2>=3.0.1",
    "python-dotenv>=1.0.0",
    "requests>=2.32.5",
    "sentencepiece>=0.2.1",
    "torch>=2.4.0",
    "torchaudio>=2.4.0",
    "torchvision>=0.19.0",
    "tqdm>=4.66.0",
    "transformers>=4.55.0,<4.56.0",
    "trl==0.22.2",
    "typer>=0.12.0",
    "unsloth==2025.8.1",
    "yarl>=1.22.0",
]
requires-python = ">=3.12,<3.13"

[project.optional-dependencies]
dev = [
    "mkdocs>=1.6.0",
    "pytest>=8.3.0",
    "ruff>=0.6.0",
]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu121"
explicit = true  # Only use this index for packages explicitly pinned to it


[tool.ruff]
line-length = 120
src = ["mova_be_llm"]
include = ["pyproject.toml", "mova_be_llm/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["mova_be_llm"]
force-sort-within-sections = true

[dependency-groups]
dev = [
    "ipykernel>=7.0.1",
    "ipywidgets>=8.1.8",
]

